# N02 基础配置：只包含公共时钟、时域、路径和复现约定。
clock:
  simulation_dt: 0.05
  sensor_dt: 0.10
  prediction_dt: 0.10
  planner_dt: 0.10
  actuator_dt: 0.05
prediction:
  history_steps: 20
  future_steps: 40
  future_dt: 0.10
planning:
  horizon_s: 3.0
paths:
  data_root: data
  output_root: artifacts
runtime:
  seed: 0
logging:
  keep_truth_separate: true
  save_failed_episodes: true
