# 用户授权三族全尺寸与早停；GPU身份/显存以预检实测为准，不依赖“64G”口述。
action: check
input_root: ../OccluActiSafe_N17_Input
output_root: ''
device: 0
font_path: ''
expected_gpu_name: A100
weights_root: ''  # 默认便携输入包/扩展权重，不修改原三份weights及输入清单
model_sizes: [n, s, m, l, x]
batch: 16
workers: 4
amp: true
pilot_epochs: 3
formal_epochs: 300
minimum_epochs: 50
early_stopping_patience: 30
checkpoint_period: 10
formal_policy: person_alias
minimum_free_gpu_mib: 24576
minimum_available_ram_mib: 16384
minimum_free_disk_gib: 500
# pilot=15模型×2配方×1seed×3轮=30次开发训练；不启用早停
# formal=15模型×3seed=45次，50～300轮；早停后与达上限均统一取model_val best.pt
# 全部模型同AMP/batch/数据/规则，实际轮数允许不同且逐条重放；不能承诺可收敛
# 每10轮保留epoch检查点，并保留best/last及全部逐步/逐轮日志与图，不自动删除失败
