<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>车内视角：算法展示概念图</title><style>body{font:16px/1.8 -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;color:#202833;max-width:1500px;margin:32px auto;padding:0 24px;background:white}h1{font-size:25px}h2{font-size:20px;margin-top:36px}img{display:block;width:100%;height:auto;border:1px solid #d7dde4}a{color:#235c98}</style><h1>车内视角：盲区来车与行人鬼探头</h1><p>核心成品是车端最终决策的避撞算法；本页为2张AI生成概念图，尚非运行截图。所有位置、速度与状态均为示意。</p><p><a href="../../算法成品与盲区鬼探头方案.md">算法方案</a> · <a href="生成提示词与来源.json">完整生成提示词</a></p><h2>1. 盲区来车：路侧补充，车端减速让行</h2><a href="images/01_incar_blind_junction.png"><img src="images/01_incar_blind_junction.png" alt="车内视角盲区来车"></a><p>车端看不到遮挡后的目标，路侧小窗提供有来源的信息；未知遮挡区与已观测目标分开表示。</p><h2>2. 行人鬼探头：短历史风险与AEB</h2><a href="images/02_incar_pedestrian_emergence.png"><img src="images/02_incar_pedestrian_emergence.png" alt="车内视角行人突然横穿"></a><p>露出后检测行人，车端制动并复核侧向通道；小窗提前观测在实际实现中需明确采集时间。</p></html>
