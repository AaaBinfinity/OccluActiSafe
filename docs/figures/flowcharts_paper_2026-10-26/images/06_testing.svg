<svg xmlns="http://www.w3.org/2000/svg" xml:space="preserve" width="148.16667mm" height="221.54444mm" viewBox="0 0 420 628" role="img" aria-labelledby="title desc">
<title id="title">实验测试与研究验证流程</title><desc id="desc">先检查模块与因果接口，使用TFD轨迹、SPD真实图像及CARLA开发与验证数据完成选型；冻结配置和协议后再开展独立正式测试。按场景统计配对结果并保留失败、缺失和分母，不把仿真结果写成实车效果。</desc>
