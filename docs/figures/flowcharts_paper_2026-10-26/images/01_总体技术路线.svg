<svg xmlns="http://www.w3.org/2000/svg" xml:space="preserve" width="148.16667mm" height="204.61111mm" viewBox="0 0 420 580" role="img" aria-labelledby="title desc">
<title id="title">系统总体技术路线</title><desc id="desc">TFD用于真实轨迹预测，SPD用于真实图像感知及预测验证，CARLA用于交互闭环；各数据域分别审计与划分，不默认逐帧配对。训练和模型验证与独立风险校准分开；路侧提供目标状态及预测，车端做最终风险判断和控制。</desc>
