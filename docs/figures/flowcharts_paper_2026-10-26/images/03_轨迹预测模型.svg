<svg xmlns="http://www.w3.org/2000/svg" xml:space="preserve" width="148.16667mm" height="144.63889mm" viewBox="0 0 420 410" role="img" aria-labelledby="title desc">
<title id="title">RC-STGT 轨迹预测模型结构</title><desc id="desc">来源门控融合合法可用的车端与路侧历史，依次编码时间、交通参与者交互及地图信息。轨迹解码器使用模式嵌入，权重分支读取融合特征；模式权重不等于已校准的碰撞概率，未来真值只供离线训练监督。</desc>
<defs><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="6" markerHeight="4.5" viewBox="0 0 6 4.5" refX="6" refY="2.25" orient="auto"><path d="M0 0 L6 2.25 L0 4.5 Z" fill="#000000"/></marker></defs>
