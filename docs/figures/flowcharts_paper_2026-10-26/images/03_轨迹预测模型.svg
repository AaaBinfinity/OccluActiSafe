<g id="node_time" fill="#ffffff" stroke="#000000" stroke-width="0.75"><rect x="118" y="142" width="184" height="36"/></g><text x="210" y="163.57" text-anchor="middle" font-size="10.5" fill="#000000"><tspan font-family="Songti SC, SimSun, STSong, serif">时间</tspan><tspan font-family="Times New Roman, Times, serif"> Transformer </tspan><tspan font-family="Songti SC, SimSun, STSong, serif">编码</tspan></text>
