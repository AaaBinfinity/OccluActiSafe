<svg xmlns="http://www.w3.org/2000/svg" xml:space="preserve" width="148.16667mm" height="204.61111mm" viewBox="0 0 420 580" role="img" aria-labelledby="title desc">
<title id="title">系统总体技术路线</title><desc id="desc">公开轨迹和仿真数据经过预处理构建训练样本。冻结预测模型后，系统结合当前观测进行轨迹预测、风险评估和主动避撞，并通过闭环仿真评估。状态反馈只回到在线预测阶段。</desc>
