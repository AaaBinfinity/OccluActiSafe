<svg xmlns="http://www.w3.org/2000/svg" xml:space="preserve" width="148.16667mm" height="205.31667mm" viewBox="0 0 420 582" role="img" aria-labelledby="title desc">
<title id="title">车路协同感知与信息交互流程</title><desc id="desc">车端和路侧使用统一适配的检测器及ByteTrack完成检测跟踪与定位；至少比较YOLO26、YOLOv8、YOLO11，依据项目实测选择。V2I上传合法观测，路侧融合并通过I2V提供目标状态及多模式预测，车端校验可用时刻和覆盖后独立判断风险并控制。状态或预测缺失按既有设计降级，未观测目标不能凭空补造。</desc>
