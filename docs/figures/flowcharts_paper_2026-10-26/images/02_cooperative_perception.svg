<title id="title">车路协同感知与信息交互流程</title><desc id="desc">车端和路端分别完成目标检测、跟踪及米制状态估计。车端通过V2I上传观测，路侧完成关联与预测后通过I2V下发，最终风险复核和控制由车端完成。失联回退见决策流程。</desc>
