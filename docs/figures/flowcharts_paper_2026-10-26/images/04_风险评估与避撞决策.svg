<svg xmlns="http://www.w3.org/2000/svg" xml:space="preserve" width="148.16667mm" height="227.89444mm" viewBox="0 0 420 646" role="img" aria-labelledby="title desc">
<title id="title">碰撞风险评估与主动避撞决策流程</title><desc id="desc">车端检查本车状态及可用路侧目标状态、预测时效和覆盖，生成并筛选候选动作；按车辆、行人及骑行者使用不同几何和区间检查，保留未知区约束。原始评分与适用校准概率分开，覆盖不足或无可行候选时执行经复核的谨慎或减损策略。</desc>
<defs><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="6" markerHeight="4.5" viewBox="0 0 6 4.5" refX="6" refY="2.25" orient="auto"><path d="M0 0 L6 2.25 L0 4.5 Z" fill="#000000"/></marker></defs>
