<g id="node_start" fill="#ffffff" stroke="#000000" stroke-width="0.75"><ellipse cx="210" cy="20" rx="35" ry="12"/></g><text x="210" y="23.57" text-anchor="middle" font-size="10.5" fill="#000000"><tspan font-family="Songti SC, SimSun, STSong, serif">开始</tspan></text>
<g id="node_input" fill="#ffffff" stroke="#000000" stroke-width="0.75"><rect x="130" y="54" width="160" height="36"/></g><text x="210" y="68.57" text-anchor="middle" font-size="10.5" fill="#000000"><tspan font-family="Songti SC, SimSun, STSong, serif">获取本车与可用观测</tspan></text><text x="210" y="82.57" text-anchor="middle" font-size="10.5" fill="#000000"><tspan font-family="Songti SC, SimSun, STSong, serif">检查路侧状态与预测</tspan></text>
