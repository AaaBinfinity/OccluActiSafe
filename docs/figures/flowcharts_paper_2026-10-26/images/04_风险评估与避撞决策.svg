<g id="node_mitigate" fill="#ffffff" stroke="#000000" stroke-width="0.75"><rect x="8" y="470" width="112" height="40"/></g><text x="64" y="486.57" text-anchor="middle" font-size="10.5" fill="#000000"><tspan font-family="Songti SC, SimSun, STSong, serif">选择可行减损动作</tspan></text><text x="64" y="500.57" text-anchor="middle" font-size="10.5" fill="#000000"><tspan font-family="Songti SC, SimSun, STSong, serif">记录无安全候选</tspan></text>
<g id="node_select" fill="#ffffff" stroke="#000000" stroke-width="0.75"><rect x="126" y="470" width="168" height="40"/></g><text x="210" y="486.57" text-anchor="middle" font-size="10.5" fill="#000000"><tspan font-family="Songti SC, SimSun, STSong, serif">主动避撞策略选择</tspan></text><text x="210" y="500.57" text-anchor="middle" font-size="10.5" fill="#000000"><tspan font-family="Songti SC, SimSun, STSong, serif">常规</tspan><tspan font-family="Times New Roman, Times, serif"> / AEB / AES</tspan></text>
<g id="node_execute" fill="#ffffff" stroke="#000000" stroke-width="0.75"><rect x="126" y="548" width="168" height="36"/></g><text x="210" y="569.57" text-anchor="middle" font-size="10.5" fill="#000000"><tspan font-family="Songti SC, SimSun, STSong, serif">执行并滚动复核</tspan></text>
