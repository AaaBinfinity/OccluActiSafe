<svg xmlns="http://www.w3.org/2000/svg" xml:space="preserve" width="148.16667mm" height="232.83333mm" viewBox="0 0 420 660" role="img" aria-labelledby="title desc">
<title id="title">MPC 车辆控制与失效回退流程</title><desc id="desc">候选动作由车端筛选后，MPC以六状态自行车模型和RK4跟踪参考；时域3秒、步长0.1秒及10Hz／20Hz为待验证配置。求解必须非阻塞，超时、无解或安全复核失败时，对回退轨迹再次复核并按实际可行性减损。</desc>
<defs><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="6" markerHeight="4.5" viewBox="0 0 6 4.5" refX="6" refY="2.25" orient="auto"><path d="M0 0 L6 2.25 L0 4.5 Z" fill="#000000"/></marker></defs>
