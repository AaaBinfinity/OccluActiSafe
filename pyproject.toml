[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "occluactisafe"
version = "0.1.0"
description = "超视野车路协同主动避撞研究工程"
requires-python = ">=3.11,<3.12"
dependencies = [
    "numpy>=1.26,<3",
    "pyyaml>=6.0.2,<7",
    "scipy>=1.15,<2",
]

[dependency-groups]
training = ["torch==2.11.0", "matplotlib==3.11.2"]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu128", marker = "sys_platform == 'win32' or sys_platform == 'linux'" }]

[tool.setuptools.packages.find]
where = ["src"]
