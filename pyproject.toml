[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "occluactisafe"
version = "0.1.0"
description = "超视野车路协同主动避撞研究工程"
requires-python = ">=3.11,<3.12"
dependencies = [
    "numpy>=1.26,<3",
    "pyyaml>=6.0.2,<7",
]

[tool.setuptools.packages.find]
where = ["src"]
